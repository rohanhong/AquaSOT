# ==============================================================================
# Ablation: No Weak 3D Cyclic Loss
#
# Disable weak 3D cycle consistency loss to assess 3D estimation quality.
#
# Author: AquaSOT-3D Team
# Date: 2025-11-10
# ==============================================================================

_base_: ../train/train.yaml


# ------------------------------------------------------------------------------
# Experiment Configuration
# ------------------------------------------------------------------------------
experiment:
  name: ablation_no_cycle3d
  tags: [ablation, no_cycle3d, no_3d_loss]
  notes: "Ablation study: Disable weak 3D cycle consistency loss"
  group: ablation


# ------------------------------------------------------------------------------
# Model Configuration - Disable Cyclic Loss
# ------------------------------------------------------------------------------
model:
  heads:
    weak3d:
      use_cyclic_loss: false  # Disable cycle loss
      cycle_weight: 0.0


# ------------------------------------------------------------------------------
# Training Configuration
# ------------------------------------------------------------------------------
training:
  loss_weights:
    weak3d_cycle: 0.0  # Disabled


# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
paths:
  work_dir: outputs/ablation_no_cycle3d
  checkpoint_dir: outputs/ablation_no_cycle3d/checkpoints
  log_dir: outputs/ablation_no_cycle3d/logs
