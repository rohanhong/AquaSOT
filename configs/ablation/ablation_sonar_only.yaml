# Ablation: Sonar-Only Single-Modality
# Assess Sonar-only tracking performance when RGB is unavailable.

_base_: ../train.yaml

experiment:
  name: ablation_sonar_only
  tags: [ablation, single_modality, sonar_only]
  notes: "Ablation study: Sonar-only tracking without RGB fusion"
  group: ablation

model:
  allow_single_modality: true   # Enable single-modality mode

  backbone:
    rgb:
      type: null                # RGB backbone disabled
    sonar:
      type: vit_sonar
      model_name: vit_base_patch16_224
      pretrained: true
      in_channels: 1
      template_size: 128
      search_size: 256

  fusion:
    type: conditional_dcma
    embed_dim: 256
    num_heads: 8

dataset:
  train:
    load_rgb: false             # Skip RGB loading for efficiency
  val:
    load_rgb: false

paths:
  work_dir: outputs/ablation_sonar_only
  checkpoint_dir: outputs/ablation_sonar_only/checkpoints
  log_dir: outputs/ablation_sonar_only/logs

training:
  num_epochs: 100               # Same as train.yaml for fair comparison
  optimizer:
    lr: 0.0001
