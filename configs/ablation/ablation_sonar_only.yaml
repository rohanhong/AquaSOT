# Ablation: Sonar-Only via Modality Dropout
#
# CRITICAL FIX (Audit 2025121202 Finding 1): Single-modality ablation using modality_dropout.
# This config simulates Sonar-only operation by always dropping RGB modality.
# The model still loads dual-modality architecture but learns to operate with RGB=zero.
# This approach maintains dual-modality architecture consistency while testing Sonar-only performance.

_base_: ../train.yaml

experiment:
  name: ablation_sonar_only
  tags: [ablation, sonar_only, modality_dropout]
  notes: "Sonar-only ablation via modality_dropout (p_drop_rgb=1.0)"
  group: ablation

# CRITICAL FIX (Audit 2025121202 Finding 1): Use modality_dropout instead of allow_single_modality
# Dual-modality architecture is preserved; RGB is zeroed during training/inference
data:
  modality_dropout:
    enabled: true
    p_drop_rgb: 1.0             # Always drop RGB (Sonar-only simulation)
    p_drop_sonar: 0.0           # Never drop sonar
    p_drop_both: 0.0            # Never drop both
    mode: zero                  # Zero out dropped modality

paths:
  work_dir: outputs/ablation_sonar_only
  checkpoint_dir: outputs/ablation_sonar_only/checkpoints
  log_dir: outputs/ablation_sonar_only/logs

training:
  num_epochs: 100               # Same as train.yaml for fair comparison
  optimizer:
    lr: 0.0001

  # RGB losses still computed but will be near-zero due to dropout
  # Keep weights for consistency; model learns Sonar-primary operation
  loss_weights:
    rgb_box: 0.1                # Reduced - RGB always dropped
    rgb_conf: 0.1               # Reduced - RGB always dropped
    rgb_validity: 0.1           # Reduced - RGB always dropped
    sonar_box: 1.0
    sonar_conf: 1.0
    sonar_validity: 1.0
    aux_rgb: 0.0                # Disabled - RGB always dropped
    aux_sonar: 0.3
    geometric_consistency: 0.0  # Disabled - no cross-modal alignment
    representation_consistency: 0.0  # Disabled - no cross-modal alignment
    view_consistency: 0.0       # Disabled - no cross-modal alignment
    routing_validity: 0.5       # Keep routing learning
