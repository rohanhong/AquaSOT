# Ablation: No Deformable Attention
# Use standard attention instead of deformable attention in fusion.

_base_: ../train.yaml

experiment:
  name: ablation_no_deformable
  tags: [ablation, no_deformable, standard_attention]
  notes: "Ablation study: Replace deformable attention with standard attention"
  group: ablation

model:
  fusion:
    use_deformable: false       # Use standard attention

paths:
  work_dir: outputs/ablation_no_deformable
  checkpoint_dir: outputs/ablation_no_deformable/checkpoints
  log_dir: outputs/ablation_no_deformable/logs
