# ==============================================================================
# Ablation: No Log-Polar Transform
#
# Disable log-polar preprocessing for sonar data.
#
# Author: AquaSOT-3D Team
# Date: 2025-11-10
# ==============================================================================

_base_: ../train/train.yaml


# ------------------------------------------------------------------------------
# Experiment Configuration
# ------------------------------------------------------------------------------
experiment:
  name: ablation_no_logpolar
  tags: [ablation, no_logpolar, raw_sonar]
  notes: "Ablation study: Disable log-polar transform for sonar"
  group: ablation


# ------------------------------------------------------------------------------
# Data Configuration
# ------------------------------------------------------------------------------
data:
  augmentation:
    use_logpolar: false  # Disable log-polar in augmentation


# ------------------------------------------------------------------------------
# Model Configuration
# ------------------------------------------------------------------------------
model:
  backbone:
    sonar:
      use_logpolar: false  # Disable log-polar in model (already false in train.yaml)


# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
paths:
  work_dir: outputs/ablation_no_logpolar
  checkpoint_dir: outputs/ablation_no_logpolar/checkpoints
  log_dir: outputs/ablation_no_logpolar/logs
