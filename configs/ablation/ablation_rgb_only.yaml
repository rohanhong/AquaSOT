# Ablation: RGB-Only Single-Modality
# Assess RGB-only tracking performance when Sonar is unavailable.

_base_: ../train.yaml

experiment:
  name: ablation_rgb_only
  tags: [ablation, single_modality, rgb_only]
  notes: "Ablation study: RGB-only tracking without Sonar fusion"
  group: ablation

model:
  allow_single_modality: true   # Enable single-modality mode

  backbone:
    rgb:
      type: vit_rgb
      model_name: vit_base_patch16_224
      pretrained: true
      template_size: 128
      search_size: 256
    sonar:
      type: null                # Sonar backbone disabled

  fusion:
    type: conditional_g2_dcma
    embed_dim: 256
    num_heads: 8

dataset:
  train:
    load_sonar: false           # Skip Sonar loading for efficiency
  val:
    load_sonar: false

paths:
  work_dir: outputs/ablation_rgb_only
  checkpoint_dir: outputs/ablation_rgb_only/checkpoints
  log_dir: outputs/ablation_rgb_only/logs

training:
  num_epochs: 100               # Same as train.yaml for fair comparison
  optimizer:
    lr: 0.0001
