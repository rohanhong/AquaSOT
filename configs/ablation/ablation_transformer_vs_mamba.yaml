# ==============================================================================
# Ablation: Transformer Baseline vs Vision-Mamba
#
# Replace Vision-Mamba with standard Transformer for temporal modeling.
#
# Author: AquaSOT-3D Team
# Date: 2025-11-10
# ==============================================================================

_base_: ../train/train.yaml


# ------------------------------------------------------------------------------
# Experiment Configuration
# ------------------------------------------------------------------------------
experiment:
  name: ablation_transformer_vs_mamba
  tags: [ablation, transformer, baseline_comparison]
  notes: "Ablation study: Transformer baseline for temporal modeling"
  group: ablation


# ------------------------------------------------------------------------------
# Model Configuration - Use Transformer
# ------------------------------------------------------------------------------
model:
  temporal:
    enabled: true
    type: transformer  # Use transformer instead of mamba
    d_model: 768
    num_heads: 8
    num_layers: 4
    dim_feedforward: 2048
    dropout: 0.1
    history_length: 8


# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
paths:
  work_dir: outputs/ablation_transformer
  checkpoint_dir: outputs/ablation_transformer/checkpoints
  log_dir: outputs/ablation_transformer/logs
