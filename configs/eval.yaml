# ==============================================================================
# Multi-Sequence Evaluation Configuration
# ==============================================================================

_base_: default.yaml


# ------------------------------------------------------------------------------
# Experiment Configuration
# ------------------------------------------------------------------------------
experiment:
  name: aquasot3d_eval_multiseq
  tags: [evaluation, multimodal]
  notes: "Multi-sequence evaluation on validation set"
  group: multiseq_evaluation


# ------------------------------------------------------------------------------
# Data Configuration (Multi-Sequence)
# ------------------------------------------------------------------------------
data:
  data_root: data
  test_sequences: [uuv3, uuv6, uuv10]

  test_root: null

  # ARCHITECTURE CHANGE (Audit 2025112104): Template-search evaluation
  # Removed: search_sequence_length, use_sequence_grouping, frame_size, sequence_length, frame_stride
  # Template and search sizes inherited from default.yaml

  num_workers: 12  # Optimized for i7-11800H (16 threads): 12 workers for faster data loading
  prefetch_factor: 4  # Increased prefetch to reduce GPU idle time (even for sequential eval)


# ------------------------------------------------------------------------------
# Evaluation Configuration
# ------------------------------------------------------------------------------
evaluation:
  mode: test
  batch_size: 1  # Sequential evaluation uses batch_size=1

  # CRITICAL FIX (Audit 2025112504 Finding 2): Template selection policy
  # Prevents template from being selected from frames where both modalities are 0000
  template:
    visibility_policy: any  # 'any'=at least one modality visible (recommended)
                            # 'both'=both modalities visible (strict)
                            # 'all'=no restriction (not recommended)

  # Standard metrics
  metrics:
    - success_auc
    - precision_20
    - precision_10
    - precision_5
    - avg_center_error
    - mean_iou
    - success_0.5
    - success_0.7

  # Per-modality evaluation
  # ARCHITECTURE UPDATE (Audit 2025112313): fusion removed (dual-view fusion architecture)
  evaluate_rgb: true
  evaluate_sonar: true
  evaluate_fusion: false  # Deprecated: RGB/Sonar now use dual-view fused features

  # Visualization
  visualization:
    enabled: true
    save_dir: outputs/eval_multiseq/visualization
    plot_trajectories: true
    plot_curves: true
    plot_attention: false
    create_videos: false
    save_failure_cases: true
    num_best: 5
    num_worst: 5

  # Result saving
  save_predictions: true
  save_metrics: true
  save_report: true
  output_dir: outputs/eval_multiseq


# ------------------------------------------------------------------------------
# Model Configuration
# ------------------------------------------------------------------------------
# ARCHITECTURE CHANGE (Audit 2025112104): Temporal config completely removed
# Template-search paradigm does not use temporal aggregation


# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
paths:
  work_dir: outputs/eval_multiseq
  checkpoint_dir: outputs/eval_multiseq/checkpoints
  log_dir: outputs/eval_multiseq/logs
