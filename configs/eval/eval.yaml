# ==============================================================================
# Multi-Sequence Evaluation Configuration
# ==============================================================================

_base_: ../base/default.yaml


# ------------------------------------------------------------------------------
# Experiment Configuration
# ------------------------------------------------------------------------------
experiment:
  name: aquasot3d_eval_multiseq
  tags: [evaluation, multimodal]
  notes: "Multi-sequence evaluation on validation set"
  group: multiseq_evaluation


# ------------------------------------------------------------------------------
# Data Configuration (Multi-Sequence)
# ------------------------------------------------------------------------------
data:
  data_root: data
  test_sequences: [uuv3, uuv6, uuv10]

  test_root: null

  search_sequence_length: 5  # Match training temporal sequence length
  use_sequence_grouping: true

  num_workers: 8  # Higher performance: 16 (Xeon W9-3475X 36C/72T)
  prefetch_factor: 2  # Keep 2 (eval is sequential, less I/O-bound)

  # Template and search sizes
  template_size: 128
  search_size: 256


# ------------------------------------------------------------------------------
# Evaluation Configuration
# ------------------------------------------------------------------------------
evaluation:
  mode: test
  batch_size: 1  # Sequential evaluation uses batch_size=1

  # Standard metrics
  metrics:
    - success_auc
    - precision_20
    - precision_10
    - precision_5
    - avg_center_error
    - mean_iou
    - success_0.5
    - success_0.7

  # Per-modality evaluation
  evaluate_rgb: true
  evaluate_sonar: true
  evaluate_fusion: true

  # Visualization
  visualization:
    enabled: true
    save_dir: outputs/eval_multiseq/visualization
    plot_trajectories: true
    plot_curves: true
    plot_attention: false
    create_videos: false
    save_failure_cases: true
    num_best: 5
    num_worst: 5

  # Result saving
  save_predictions: true
  save_metrics: true
  save_report: true
  output_dir: outputs/eval_multiseq


# ------------------------------------------------------------------------------
# Model Configuration
# ------------------------------------------------------------------------------
model:
  temporal:
    aggregation: true
    aggregator:
      momentum: 0.9
      gate_threshold: 0.5


# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
paths:
  work_dir: outputs/eval_multiseq
  checkpoint_dir: outputs/eval_multiseq/checkpoints
  log_dir: outputs/eval_multiseq/logs
