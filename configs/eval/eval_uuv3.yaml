# ==============================================================================
# Evaluation Configuration for UUV3 Dataset
#
# Comprehensive evaluation on UUV3 test set with metrics computation,
# visualization, and failure analysis.
#
# Author: AquaSOT-3D Team
# Date: 2025-11-10
# ==============================================================================

_base_: ../base/default.yaml


# ------------------------------------------------------------------------------
# Experiment Configuration
# ------------------------------------------------------------------------------
experiment:
  name: aquasot3d_eval_uuv3
  tags: [uuv3, evaluation, test_set]
  notes: "Full evaluation on UUV3 test set with RGBS50 metrics"
  group: evaluation


# ------------------------------------------------------------------------------
# Data Configuration
# ------------------------------------------------------------------------------
data:
  # Evaluation dataset (consistent with train config path format)
  test_root: data/uuv3
  test_split: test

  # No augmentation for evaluation
  augmentation:
    enabled: false

  # Evaluation dataloader
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

  # Image sizes (inherited from base, but explicitly set for clarity)
  template_size: 128
  search_size: 256

  # Template-search pair sampling (same as training)
  template_search_gap: 30


# ------------------------------------------------------------------------------
# Model Configuration
# ------------------------------------------------------------------------------
model:
  # Full multi-modal model configuration
  # Model weights will be loaded from checkpoint, but config defines architecture
  type: AquaSOT3DTracker

  backbone:
    rgb:
      type: vit_rgb
      model_name: vit_base_patch16_224
      pretrained: false  # Weights from checkpoint
      output_dim: 768

    sonar:
      type: sonar
      encoder_type: vit
      use_logpolar: true
      output_dim: 768

  fusion:
    type: g2_dcma
    embed_dim: 768
    num_heads: 8
    num_layers: 2

  temporal:
    type: mamba
    enabled: true
    num_layers: 2
    d_state: 16
    d_conv: 4
    expand: 2
    bidirectional: false
    use_occlusion_gating: true
    dropout: 0.1
    max_spatial_size: 32

  heads:
    rgb_box:
      type: BoxHead
      in_channels: 768
      hidden_dim: 256

    sonar_box:
      type: BoxHead
      in_channels: 768
      hidden_dim: 256

    fusion_box:
      type: FusionHead
      rgb_channels: 768
      sonar_channels: 768
      hidden_dim: 256

    weak3d:
      type: Weak3DHead
      in_channels: 768
      hidden_dim: 256
      output_dim: 3
      use_cyclic_loss: true


# ------------------------------------------------------------------------------
# Evaluation Configuration
# ------------------------------------------------------------------------------
evaluation:
  # Evaluation mode
  mode: test

  # Batch size (usually 1 for tracking)
  batch_size: 1

  # Checkpoint to evaluate
  checkpoint: null  # Must be provided via command line

  # Metrics to compute
  metrics:
    - success_auc
    - precision_20
    - precision_10
    - precision_5
    - avg_center_error
    - mean_iou
    - success_0.5
    - success_0.7

  # Per-modality evaluation
  evaluate_rgb: true
  evaluate_sonar: true
  evaluate_fusion: true

  # Visualization settings
  visualization:
    enabled: true
    save_dir: outputs/eval_uuv3/visualization

    # Visualizations to create
    plot_trajectories: true
    plot_curves: true
    plot_attention: true  # Enable attention visualization
    create_videos: true  # Create tracking videos

    # Frame visualization
    draw_boxes: true
    draw_trajectories: true
    multi_modal_view: true  # Side-by-side RGB and Sonar

    # Video settings
    video_fps: 10
    video_codec: mp4v

    # Failure analysis
    save_failure_cases: true
    num_best: 10  # Save top 10 sequences
    num_worst: 10  # Save bottom 10 sequences for analysis

    # Figure settings
    dpi: 150
    figure_format: png

  # Result saving
  save_predictions: true
  save_metrics: true
  save_report: true
  output_dir: outputs/eval_uuv3

  # Per-sequence results
  save_per_sequence: true
  sequence_output_format: json  # json or npz

  # Evaluation report
  report:
    format: [txt, json, html]  # Multiple formats
    include_per_sequence: true
    include_statistics: true
    include_plots: true


# ------------------------------------------------------------------------------
# System Configuration
# ------------------------------------------------------------------------------
system:
  device: cuda
  num_gpus: 1

  # Disable training-specific features
  use_amp: false  # Use FP32 for evaluation
  deterministic: true  # Reproducible evaluation


# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
paths:
  work_dir: outputs/eval_uuv3
  checkpoint_dir: null  # Not used for evaluation
  log_dir: outputs/eval_uuv3/logs


# ------------------------------------------------------------------------------
# Analysis Configuration
# ------------------------------------------------------------------------------
analysis:
  # Attribute-based analysis (if attributes available)
  analyze_attributes: true
  attributes:
    - occlusion
    - illumination_variation
    - scale_change
    - fast_motion
    - motion_blur

  # Per-attribute statistics
  attribute_analysis:
    enabled: true
    min_frames_per_attribute: 10

  # Comparison with baselines (if available)
  compare_baselines: false
  baseline_results_dir: null


# ------------------------------------------------------------------------------
# Debugging/Fast Evaluation
# ------------------------------------------------------------------------------
debug:
  enabled: false
  fast_dev_run: false

  # Evaluate on subset
  max_sequences: null  # null means all sequences
  max_frames_per_sequence: null  # null means all frames
