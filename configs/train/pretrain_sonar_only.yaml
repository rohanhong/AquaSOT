# ==============================================================================
# Sonar-Only Pretraining Configuration (Stage 2)
#
# Pretrain the sonar branch independently to learn sonar-specific features.
# Helps initialize the sonar encoder before multi-modal fusion training.
#
# Author: AquaSOT-3D Team
# Date: 2025-11-11
# ==============================================================================

_base_: ../base/default.yaml


# ------------------------------------------------------------------------------
# Experiment Configuration
# ------------------------------------------------------------------------------
experiment:
  name: aquasot3d_pretrain_sonar
  tags: [multiseq, sonar_only, pretrain, single_modal]
  notes: "Sonar-only pretraining with log-polar preprocessing across 9 training sequences"
  group: pretraining


# ------------------------------------------------------------------------------
# Data Configuration (Multi-Sequence)
# ------------------------------------------------------------------------------
data:
  data_root: data
  train_sequences: [uuv1, uuv2, uuv4, uuv5, uuv7, uuv8, uuv9, uuv11, uuv12]
  val_sequences: [uuv3, uuv6, uuv10]

  # Augmentation for Sonar-only (acoustic-specific transforms)
  augmentation:
    enabled: true

    # RGB disabled for Sonar-only pretraining
    rgb:
      enable_color_jitter: false
      enable_blur: false
      enable_occlusion: false

    # Sonar-specific transforms (acoustic imagery with fan geometry)
    sonar:
      enable_speckle: true
      speckle_level: 0.1
      speckle_prob: 0.5

      # DISABLED: RadialScalingJitter has bbox synchronization bug
      # Geometric transform modifies image coordinates but does not update bbox
      # This causes ~19% IoU loss (proven mathematically)
      # Will be re-enabled after implementing bbox-aware transform in Level 2 fix
      enable_radial_jitter: false
      radial_scale_range: [0.9, 1.1]
      radial_jitter_prob: 0.3

      enable_sector_occlusion: true
      sector_min_angle: 10.0
      sector_max_angle: 40.0
      sector_occlusion_prob: 0.2


# ------------------------------------------------------------------------------
# Model Configuration
# ------------------------------------------------------------------------------
model:
  # Disable RGB branch and fusion
  backbone:
    rgb:
      type: null  # Disable RGB backbone

  fusion:
    type: null  # Disable fusion

  temporal:
    enabled: true
    num_layers: 8  # Increased for full training (vs. 2 in test)

  heads:
    # Only sonar head enabled
    rgb_box:
      type: null

    sonar_box:
      type: BoxHead
      in_channels: 768
      hidden_dim: 256

    fusion_box:
      type: null

    weak3d:
      type: null


# ------------------------------------------------------------------------------
# Training Configuration
# ------------------------------------------------------------------------------
training:
  num_epochs: 40  # Full pretraining (vs. 5 in test)

  batch_size: 8  # Optimized for RTX 3070 Laptop (~50% VRAM, experimentally verified)
  gradient_accumulation_steps: 1  # Effective batch = 8

  optimizer:
    lr: 0.0003
    weight_decay: 0.0001
    backbone_lr_multiplier: 1.0  # No pretrained backbone

  scheduler:
    type: cosine
    warmup_epochs: 3
    t_max: 40
    eta_min: 1.0e-06

  # Loss weights - Sonar only
  loss_weights:
    rgb_box: 0.0
    rgb_cls: 0.0
    sonar_box: 1.0
    sonar_cls: 0.5
    fusion_box: 0.0
    fusion_cls: 0.0
    weak3d_reg: 0.0
    weak3d_cycle: 0.0
    geometric_consistency: 0.0
    component_consistency: 0.0
    representation_consistency: 0.0
    temporal_smooth: 0.05

  val_interval: 1  # Validate every epoch for best checkpoint tracking

  checkpoint:
    save_interval: 5  # Save interval checkpoint every 5 epochs
    metric: val_total  # Use validation total loss for best tracking
    mode: min  # Lower loss is better

  log_interval: 10


# ------------------------------------------------------------------------------
# Debugging Configuration
# ------------------------------------------------------------------------------
debug:
  enabled: false
  fast_dev_run: false


# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
paths:
  work_dir: outputs/pretrain_sonar
  checkpoint_dir: outputs/pretrain_sonar/checkpoints
  log_dir: outputs/pretrain_sonar/logs