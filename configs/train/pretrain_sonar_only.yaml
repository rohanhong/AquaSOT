# ==============================================================================
# Sonar-Only Pretraining Configuration (Stage 2)
# ==============================================================================

_base_: ../base/default.yaml


# ------------------------------------------------------------------------------
# Experiment Configuration
# ------------------------------------------------------------------------------
experiment:
  name: aquasot3d_pretrain_sonar
  tags: [multiseq, sonar_only, pretrain]
  notes: "Sonar-only pretraining with bbox-aware augmentation"
  group: pretraining


# ------------------------------------------------------------------------------
# Data Configuration (Multi-Sequence)
# ------------------------------------------------------------------------------
data:
  data_root: data
  train_sequences: [uuv1, uuv2, uuv4, uuv5, uuv7, uuv8, uuv9, uuv11, uuv12]
  val_sequences: [uuv3, uuv6, uuv10]

  # Inherits from default.yaml (num_workers=8, prefetch_factor=2)
  # Higher performance: num_workers=24, prefetch_factor=3 (Xeon W9-3475X 36C/72T)

  augmentation:
    enabled: true
    type: TrackingAugmentationBboxAware

    rgb:
      enable_color_jitter: false
      enable_blur: false

    sonar:
      enable_speckle: true
      speckle_level: 0.1
      speckle_prob: 0.5

      # Rectangular occlusion (similar to RGB, suitable for rect coordinates)
      enable_occlusion: true
      occlusion_prob: 0.2
      occlusion_min_size: 0.05
      occlusion_max_size: 0.3


# ------------------------------------------------------------------------------
# Model Configuration
# ------------------------------------------------------------------------------
model:
  backbone:
    rgb:
      type: null

    sonar:
      type: vit_sonar
      model_name: vit_base_patch16_224
      pretrained: true
      in_channels: 1  # Single-channel sonar (1ch -> 3ch adapter applied internally)
      # NOTE: Sonar images are preprocessed to fixed 682x376, then resized to 224x224 for model input
      img_size: 224
      output_dim: 768

  fusion:
    type: null

  temporal:
    enabled: true
    num_layers: 8

  heads:
    rgb_box:
      type: null

    sonar_box:
      type: BoxHead
      in_channels: 768
      hidden_dim: 256

    fusion_box:
      type: null

    weak3d:
      type: null


# ------------------------------------------------------------------------------
# Training Configuration
# ------------------------------------------------------------------------------
training:
  num_epochs: 40

  batch_size: 8  # Higher performance: 64 (60% VRAM usage on high-end GPU)
  gradient_accumulation_steps: 1  # Higher performance: 1 (effective batch = 64)

  optimizer:
    lr: 0.0001  # Higher performance: 0.0008 (linearly scaled for batch=64, 8x base lr)
    weight_decay: 0.0001
    backbone_lr_multiplier: 1.0

  scheduler:
    type: cosine
    warmup_epochs: 5  # Higher performance: 8 (20% ratio for large batch=64, NOT 40!)
    warmup_lr: 1.0e-06  # Higher performance: 8.0e-06 (linearly scaled for batch=64)
    t_max: 40
    eta_min: 1.0e-06

  # Gradient clipping
  grad_clip:
    enabled: true
    max_norm: 1.0  # Higher performance: 2.0 (larger batch=64 more stable gradients)
    norm_type: 2

  loss_weights:
    rgb_box: 0.0
    rgb_cls: 0.0
    sonar_box: 1.0
    sonar_cls: 0.5
    fusion_box: 0.0
    fusion_cls: 0.0
    weak3d_reg: 0.0
    weak3d_cycle: 0.0
    geometric_consistency: 0.0
    component_consistency: 0.0
    representation_consistency: 0.0
    quality_fusion_loss: 0.0
    temporal_smooth: 0.05

  loss_schedule:
    enabled: false

  val_interval: 1

  checkpoint:
    save_interval: 5
    save_best: true
    save_last: true
    metric: val_total
    mode: min
    max_keep: 5

  log_interval: 10


# ------------------------------------------------------------------------------
# Debugging Configuration
# ------------------------------------------------------------------------------
debug:
  enabled: false
  fast_dev_run: false


# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
paths:
  work_dir: outputs/pretrain_sonar
  checkpoint_dir: outputs/pretrain_sonar/checkpoints
  log_dir: outputs/pretrain_sonar/logs