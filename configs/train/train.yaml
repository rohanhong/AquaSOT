# ==============================================================================
# Multi-Sequence Training Configuration
#
# Full multi-modal training with RGB + Sonar across multiple sequences.
# Uses the new multi-sequence dataset architecture with 9 training sequences.
#
# Author: AquaSOT-3D Team
# Date: 2025-11-14
# ==============================================================================

_base_: ../base/default.yaml


# ------------------------------------------------------------------------------
# Experiment Configuration
# ------------------------------------------------------------------------------
experiment:
  name: aquasot3d_multiseq_full
  tags: [production, multimodal, fusion, multiseq]
  notes: "Multi-sequence training across 9 sequences (uuv1,2,4,5,7,8,9,11,12)"
  group: multiseq_training


# ------------------------------------------------------------------------------
# Data Configuration (Multi-Sequence)
# ------------------------------------------------------------------------------
data:
  # Multi-sequence configuration (replaces train_root/val_root)
  data_root: data
  train_sequences: [uuv1, uuv2, uuv4, uuv5, uuv7, uuv8, uuv9, uuv11, uuv12]
  val_sequences: [uuv3, uuv6, uuv10]

  # Legacy paths set to null (not used in multi-sequence mode)
  train_root: null
  val_root: null

  # CRITICAL FIX (Audit 2025111705 Finding 1): Enable multi-frame temporal training
  # Stage 3 must use sequences (not pairs) to train Vision-Mamba temporal modeling
  search_sequence_length: 5  # 5-frame temporal (VRAM-intensive: 5x single-frame)
  use_sequence_grouping: true

  num_workers: 8  # Higher performance: 16 (Xeon W9-3475X 36C/72T)
  prefetch_factor: 2  # Higher performance: 3

  # Multi-modal augmentation
  augmentation:
    enabled: true

    # RGB-specific transforms
    rgb:
      enable_color_jitter: true
      brightness: 0.3
      contrast: 0.3
      saturation: 0.3
      hue: 0.2
      color_jitter_prob: 0.5

      enable_blur: true
      blur_prob: 0.3

      enable_occlusion: true
      occlusion_prob: 0.2
      occlusion_min_size: 0.05
      occlusion_max_size: 0.3

    # Sonar-specific transforms
    sonar:
      enable_speckle: true
      speckle_level: 0.1
      speckle_prob: 0.5

      enable_radial_jitter: false  # Disabled due to bbox sync bug
      radial_scale_range: [0.9, 1.1]
      radial_jitter_prob: 0.3

      enable_sector_occlusion: true
      sector_min_angle: 10.0
      sector_max_angle: 40.0
      sector_occlusion_prob: 0.2


# ------------------------------------------------------------------------------
# Model Configuration
# ------------------------------------------------------------------------------
model:
  # All components enabled
  backbone:
    rgb:
      type: vit_rgb
      model_name: vit_base_patch16_224
      pretrained: true
      # Note: pretrained_path is auto-set from training.init_backbones.rgb
      output_dim: 768
    sonar:
      type: sonar
      encoder_type: vit
      use_logpolar: true
      # Note: pretrained_path is auto-set from training.init_backbones.sonar
      output_dim: 768

  fusion:
    type: g2_dcma
    embed_dim: 768
    num_heads: 8
    num_layers: 2

  temporal:
    type: mamba
    enabled: true
    num_layers: 2
    d_state: 16
    d_conv: 4
    expand: 2
    bidirectional: false
    use_occlusion_gating: true
    dropout: 0.1
    max_spatial_size: 32
    # Enable EMA aggregation for fusion training (Stage 3)
    aggregation: true
    aggregator:
      momentum: 0.9  # EMA smoothing factor
      gate_threshold: 0.5  # Quality threshold for gating

  heads:
    rgb_box:
      type: BoxHead
      in_channels: 768
      hidden_dim: 256

    sonar_box:
      type: BoxHead
      in_channels: 768
      hidden_dim: 256

    fusion_box:
      type: FusionHead
      rgb_channels: 768
      sonar_channels: 768
      hidden_dim: 256

    weak3d:
      type: Weak3DHead
      in_channels: 768
      hidden_dim: 256
      output_dim: 3
      use_cyclic_loss: true


# ------------------------------------------------------------------------------
# Training Configuration
# ------------------------------------------------------------------------------
training:
  # CRITICAL FIX (Audit 2025111704 Finding 2): Load Stage 1/2 pretrained weights
  # Set these paths to enable the three-stage curriculum
  init_backbones:
    rgb: outputs/pretrain_rgb/checkpoints/checkpoint_best.pth
    sonar: outputs/pretrain_sonar/checkpoints/checkpoint_best.pth

  num_epochs: 40

  batch_size: 1  # Higher performance: 2 (A4000 16GB, 2x VRAM; 5-frame uses 5x VRAM)
  gradient_accumulation_steps: 4  # Higher performance: 2 (effective batch = 4 maintained)

  optimizer:
    lr: 0.0001  # Keep constant if effective batch unchanged
    weight_decay: 0.0001
    backbone_lr_multiplier: 0.1

  scheduler:
    type: cosine
    warmup_epochs: 3  # Keep constant for fine-tuning pretrained backbones
    warmup_lr: 0.00001
    min_lr: 0.000001
    t_max: 40
    eta_min: 0.000001

  # Full loss weights
  loss_weights:
    rgb_box: 1.0
    rgb_cls: 0.5
    sonar_box: 1.0
    sonar_cls: 0.5
    fusion_box: 2.0
    fusion_cls: 1.0
    weak3d_reg: 1.0
    weak3d_cycle: 0.5
    geometric_consistency: 0.1
    component_consistency: 0.1
    representation_consistency: 0.1
    temporal_smooth: 0.05

  val_interval: 1  # Validate every epoch

  checkpoint:
    save_interval: 5
    metric: val_total
    mode: min

  log_interval: 10

  resume: null


# ------------------------------------------------------------------------------
# Debugging
# ------------------------------------------------------------------------------
debug:
  enabled: false
  fast_dev_run: false


# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
paths:
  work_dir: outputs/train_multiseq
  checkpoint_dir: outputs/train_multiseq/checkpoints
  log_dir: outputs/train_multiseq/logs
