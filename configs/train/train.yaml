# ==============================================================================
# Multi-Sequence Training Configuration (Stage 3)
# ==============================================================================

_base_: ../base/default.yaml


# ------------------------------------------------------------------------------
# Experiment Configuration
# ------------------------------------------------------------------------------
experiment:
  name: aquasot3d_multiseq_full
  tags: [production, multimodal, fusion]
  notes: "Full multi-modal training with bbox-aware augmentation"
  group: multiseq_training


# ------------------------------------------------------------------------------
# Data Configuration (Multi-Sequence)
# ------------------------------------------------------------------------------
data:
  data_root: data
  train_sequences: [uuv1, uuv2, uuv4, uuv5, uuv7, uuv8, uuv9, uuv11, uuv12]
  val_sequences: [uuv3, uuv6, uuv10]

  train_root: null
  val_root: null

  search_sequence_length: 5  # Multi-frame temporal for Vision-Mamba
  use_sequence_grouping: true

  num_workers: 8  # Higher performance: 16 (Xeon W9-3475X 36C/72T)
  prefetch_factor: 2  # Higher performance: 3

  augmentation:
    enabled: true
    type: TrackingAugmentationBboxAware

    rgb:
      enable_color_jitter: true
      brightness: 0.3
      contrast: 0.3
      saturation: 0.3
      hue: 0.2
      color_jitter_prob: 0.5

      enable_blur: true
      blur_prob: 0.3

      enable_occlusion: true
      occlusion_prob: 0.2
      occlusion_min_size: 0.05
      occlusion_max_size: 0.3

    sonar:
      enable_speckle: true
      speckle_level: 0.1
      speckle_prob: 0.5

      enable_radial_jitter: false  # Conservative: disabled until validated
      radial_scale_range: [0.9, 1.1]
      radial_jitter_prob: 0.3

      enable_sector_occlusion: true
      sector_min_angle: 10.0
      sector_max_angle: 40.0
      sector_occlusion_prob: 0.2

      normalization_mode: adaptive
      fov_angle: 130.0

    use_logpolar: true
    logpolar_config:
      output_height: 224
      output_width: 224
      fov_angle: 130.0
      alpha: 1.0
      beta: 1.0


# ------------------------------------------------------------------------------
# Model Configuration
# ------------------------------------------------------------------------------
model:
  backbone:
    rgb:
      type: vit_rgb
      model_name: vit_base_patch16_224
      pretrained: true
      output_dim: 768

    sonar:
      type: sonar
      encoder_type: vit
      img_size: [224, 224]
      sonar_fov_angle: 130.0
      max_range_pixels: 224
      use_logpolar: false  # Disabled: augmentation already applies log-polar
      output_dim: 768

  fusion:
    type: g2_dcma
    embed_dim: 768
    num_heads: 8
    num_layers: 2

  temporal:
    type: mamba
    enabled: true
    num_layers: 2
    d_state: 16
    d_conv: 4
    expand: 2
    bidirectional: false
    use_occlusion_gating: true
    dropout: 0.1
    max_spatial_size: 32
    aggregation: true
    aggregator:
      momentum: 0.9
      gate_threshold: 0.5

  heads:
    rgb_box:
      type: BoxHead
      in_channels: 768
      hidden_dim: 256

    sonar_box:
      type: BoxHead
      in_channels: 768
      hidden_dim: 256

    fusion_box:
      type: FusionHead
      rgb_channels: 768
      sonar_channels: 768
      hidden_dim: 256

    weak3d:
      type: Weak3DHead
      in_channels: 768
      hidden_dim: 256
      output_dim: 3
      use_cyclic_loss: true


# ------------------------------------------------------------------------------
# Training Configuration
# ------------------------------------------------------------------------------
training:
  init_backbones:
    rgb: outputs/pretrain_rgb/checkpoints/checkpoint_best.pth
    sonar: outputs/pretrain_sonar/checkpoints/checkpoint_best.pth

  num_epochs: 40

  batch_size: 1  # Higher performance: 2 (A4000 16GB, 5-frame temporal uses ~10GB per batch)
  gradient_accumulation_steps: 4  # Higher performance: 2 (effective batch = 2×2 = 4)

  optimizer:
    lr: 0.0001  # Higher performance: Keep 0.0001 if effective batch unchanged
    weight_decay: 0.0001
    backbone_lr_multiplier: 0.1

  scheduler:
    type: cosine
    warmup_epochs: 5  # Higher performance: 3 (pretrained backbones converge faster)
    warmup_lr: 1.0e-06
    t_max: 40
    eta_min: 1.0e-06

  # Gradient clipping
  grad_clip:
    enabled: true
    max_norm: 1.0  # Higher performance: 2.0 (pretrained backbones more stable)
    norm_type: 2

  loss_weights:
    rgb_box: 1.0
    rgb_cls: 0.5
    sonar_box: 1.0
    sonar_cls: 0.5
    fusion_box: 2.0
    fusion_cls: 1.0
    weak3d_reg: 1.0
    weak3d_cycle: 0.5
    geometric_consistency: 0.1
    component_consistency: 0.1
    representation_consistency: 0.1
    quality_fusion_loss: 0.2
    temporal_smooth: 0.05

  loss_schedule:
    enabled: false

  val_interval: 1

  checkpoint:
    save_interval: 5
    save_best: true
    save_last: true
    metric: val_total
    mode: min
    max_keep: 5

  log_interval: 10

  resume: null


# ------------------------------------------------------------------------------
# Debugging
# ------------------------------------------------------------------------------
debug:
  enabled: false
  fast_dev_run: false


# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
paths:
  work_dir: outputs/train_multiseq
  checkpoint_dir: outputs/train_multiseq/checkpoints
  log_dir: outputs/train_multiseq/logs
