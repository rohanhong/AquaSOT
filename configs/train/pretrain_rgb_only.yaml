# ==============================================================================
# RGB-Only Pretraining Configuration (Stage 1)
#
# Pretrain the RGB branch independently before full multi-modal training.
# Useful for transfer learning and component-wise analysis.
#
# Author: AquaSOT-3D Team
# Date: 2025-11-11
# ==============================================================================

_base_: ../base/default.yaml


# ------------------------------------------------------------------------------
# Experiment Configuration
# ------------------------------------------------------------------------------
experiment:
  name: aquasot3d_pretrain_rgb
  tags: [multiseq, rgb_only, pretrain, single_modal]
  notes: "RGB-only pretraining for transfer learning across 9 training sequences"
  group: pretraining


# ------------------------------------------------------------------------------
# Data Configuration (Multi-Sequence)
# ------------------------------------------------------------------------------
data:
  data_root: data
  train_sequences: [uuv1, uuv2, uuv4, uuv5, uuv7, uuv8, uuv9, uuv11, uuv12]
  val_sequences: [uuv3, uuv6, uuv10]

  # Augmentation for RGB-only (domain-specific transforms)
  augmentation:
    enabled: true

    # RGB-specific transforms (optical imagery)
    rgb:
      enable_color_jitter: true
      brightness: 0.3
      contrast: 0.3
      saturation: 0.3
      hue: 0.2
      color_jitter_prob: 0.5

      enable_blur: true
      blur_prob: 0.3

      enable_occlusion: true
      occlusion_prob: 0.2
      occlusion_min_size: 0.05
      occlusion_max_size: 0.3

    # Sonar disabled for RGB-only pretraining
    sonar:
      enable_speckle: false
      enable_radial_jitter: false
      enable_sector_occlusion: false


# ------------------------------------------------------------------------------
# Model Configuration
# ------------------------------------------------------------------------------
model:
  # Disable sonar branch and fusion
  backbone:
    sonar:
      type: null  # Disable sonar encoder

  fusion:
    type: null  # Disable fusion

  temporal:
    enabled: true
    num_layers: 8  # Increased for full training (vs. 2 in test)

  heads:
    # Only RGB head enabled
    rgb_box:
      type: BoxHead
      in_channels: 768
      hidden_dim: 256

    sonar_box:
      type: null

    fusion_box:
      type: null

    weak3d:
      type: null


# ------------------------------------------------------------------------------
# Training Configuration
# ------------------------------------------------------------------------------
training:
  num_epochs: 40  # Full pretraining (vs. 5 in test)

  batch_size: 8
  gradient_accumulation_steps: 1

  optimizer:
    lr: 0.0003
    weight_decay: 0.0001

  scheduler:
    type: cosine
    warmup_epochs: 3
    t_max: 40
    eta_min: 1.0e-06

  # Loss weights - RGB only
  loss_weights:
    rgb_box: 1.0
    rgb_cls: 0.5
    temporal_smooth: 0.05
    # All other losses disabled
    sonar_box: 0.0
    sonar_cls: 0.0
    fusion_box: 0.0
    fusion_cls: 0.0
    weak3d_reg: 0.0
    weak3d_cycle: 0.0
    geometric_consistency: 0.0
    component_consistency: 0.0
    representation_consistency: 0.0

  val_interval: 1  # Validate every epoch for best checkpoint tracking

  checkpoint:
    save_interval: 5  # Save interval checkpoint every 5 epochs
    metric: val_total  # Use validation total loss for best tracking
    mode: min  # Lower loss is better

  log_interval: 10


# ------------------------------------------------------------------------------
# Debugging Configuration
# ------------------------------------------------------------------------------
debug:
  enabled: false
  fast_dev_run: false


# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
paths:
  work_dir: outputs/pretrain_rgb
  checkpoint_dir: outputs/pretrain_rgb/checkpoints
  log_dir: outputs/pretrain_rgb/logs