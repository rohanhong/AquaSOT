# ==============================================================================
# AquaSOT-3D Default Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# System Configuration
# ------------------------------------------------------------------------------
system:
  # Random seed for reproducibility
  seed: 42

  # Device configuration
  device: cuda
  num_gpus: 1

  # Distributed training
  distributed: false
  dist_backend: nccl
  dist_url: env://

  # Mixed precision training
  # FIXED (Audit 2025112103): BCE assertion failures resolved by adding autocast protection
  # Re-enabled for 30% faster training with bfloat16 (better numerical stability than float16)
  use_amp: true
  amp_dtype: bfloat16  # bfloat16 provides better numerical stability than float16

  # Deterministic mode (slower but reproducible)
  deterministic: false
  benchmark: true


# ------------------------------------------------------------------------------
# Data Configuration
# ------------------------------------------------------------------------------
data:
  data_root: data
  train_sequences: [uuv1, uuv2, uuv4, uuv5, uuv7, uuv8, uuv9, uuv11, uuv12]
  val_sequences: [uuv3, uuv6, uuv10]
  test_sequences: [uuv3, uuv6, uuv10]

  train_root: null
  val_root: null
  test_root: null

  train_split: train
  val_split: val
  test_split: test

  num_workers: 8  # Higher performance: 24 (Xeon W9-3475X 36C/72T)
  pin_memory: true
  prefetch_factor: 2  # Higher performance: 3 (with more workers)
  persistent_workers: true

  # ARCHITECTURE CHANGE (Audit 2025112104): Template-search paradigm (OSTrack-style)
  # Removed: sequence_length, frame_stride, use_sequence_grouping, frame_size
  # Training uses random template-search pairs, evaluation uses sequential pairs
  template_size: 256  # Template frame size (256x256, letterbox preprocessing)
  search_size: 512    # Search frame size (512x512, full-frame search)
  template_search_gap_range: [1, 200]  # Gap range for template-search pairs (training only, OSTrack standard)

  # Data augmentation (legacy params, override in specific configs)
  augmentation:
    enabled: true

    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1

    rotation: 15.0
    scale_range: [0.8, 1.2]
    translation_range: [0.1, 0.1]

    horizontal_flip: 0.5
    vertical_flip: 0.0

    random_erase: 0.3
    erase_ratio: [0.02, 0.2]

  # Normalization
  normalize:
    rgb_mean: [0.485, 0.456, 0.406]
    rgb_std: [0.229, 0.224, 0.225]
    sonar_mean: [0.5]
    sonar_std: [0.5]


# ------------------------------------------------------------------------------
# Model Architecture Configuration
# ------------------------------------------------------------------------------
model:
  type: AquaSOT3DTracker

  backbone:
    rgb:
      type: vit_rgb
      model_name: vit_base_patch16_224
      pretrained: true
      pretrained_path: null
      freeze_bn: false
      output_layers: [9, 11]
      output_dim: 768

    sonar:
      type: vit_sonar
      model_name: vit_base_patch16_224
      pretrained: true
      in_channels: 1  # Single-channel sonar (1ch -> 3ch adapter applied internally)
      # NOTE: Sonar images are preprocessed to rectangular coordinates (682x376)
      # before training. See scripts/preprocess_sonar.py and docs/Training_Guide.md
      img_size: 512
      output_dim: 768

  fusion:
    type: g2_dcma
    embed_dim: 768
    num_heads: 8
    num_layers: 2

    use_geometry_gating: true
    geometry_gate_type: adaptive

    use_quality_gating: true
    quality_threshold: 0.5

    use_deformable: true
    num_points: 4
    num_levels: 1

    component_consistency_weight: 0.1
    representation_consistency_weight: 0.1

  # ARCHITECTURE CHANGE (Audit 2025112104): Temporal modules completely removed
  # Template-search paradigm uses implicit temporal modeling via per-frame template updates

  heads:
    rgb_box:
      type: BoxHead
      in_channels: 768
      hidden_dim: 256
      num_layers: 3
      output_format: cxcywh

    sonar_box:
      type: BoxHead
      in_channels: 768
      hidden_dim: 256
      num_layers: 3
      output_format: cxcywh

    fusion_box:
      type: FusionHead
      rgb_channels: 768
      sonar_channels: 768
      hidden_dim: 256
      num_layers: 3
      output_format: cxcywh

    weak3d:
      type: Weak3DHead
      in_channels: 768
      hidden_dim: 256
      output_dim: 3
      use_cyclic_loss: true
      cycle_weight: 0.5

      # CRITICAL (Audit 2025112103): Hardware-specific FOV parameters
      # RGB Camera (HD Zoom SeaCam): 47deg horizontal x 27deg vertical FOV
      max_angle_rgb_horizontal: 0.41015  # 23.5 degrees (half of 47deg FOV)
      max_angle_rgb_vertical: 0.23562    # 13.5 degrees (half of 27deg FOV)

      # Sonar (Oculus MD-Series): 130deg horizontal FOV
      max_angle_sonar_horizontal: 1.13446  # 65 degrees (half of 130deg FOV)

      # Coordinate system units: pixels (sonar_rect image space)
      # Audit 2025112103: Updated to match sonar_rect image height (682x376)
      radial_range: [0.0, 376.0]  # Depth range in pixels (sonar_rect height)
      default_depth: 188.0         # Default depth for zero-modality scenarios (middle of range)
      num_radial_bins: 50          # Number of bins for sonar radial discretization


# ------------------------------------------------------------------------------
# Training Configuration
# ------------------------------------------------------------------------------
training:
  init_backbones:
    rgb: null
    sonar: null

  num_epochs: 60

  batch_size: 16  # Higher performance: 64 (60% VRAM usage on high-end GPU)
  val_batch_size: 32  # Higher performance: 128 (validation requires no gradients)
  gradient_accumulation_steps: 1  # Higher performance: 1 (effective batch = 64)

  # Optimizer
  optimizer:
    type: adamw
    lr: 0.0002  # Higher performance: 0.0008 (linearly scaled for batch=64, 4x base lr)
    weight_decay: 0.0001
    betas: [0.9, 0.999]
    eps: 1.0e-8

    # Parameter groups
    use_layer_decay: true
    layer_decay_rate: 0.75

    # Backbone specific
    backbone_lr_multiplier: 0.1

  # Learning rate scheduler
  scheduler:
    type: cosine  # cosine, step, multistep, exponential, polynomial
    warmup_epochs: 5  # Higher performance: 7 (12% ratio for batch=64, 4x increase)
    warmup_lr: 0.00001  # Higher performance: 0.00004 (linearly scaled for batch=64)
    min_lr: 0.000001

    # Cosine annealing
    t_max: 60
    eta_min: 0.000001

    # Step scheduler (alternative)
    # type: step
    # step_size: 20
    # gamma: 0.1

  # Gradient clipping
  grad_clip:
    enabled: true
    max_norm: 1.0  # Higher performance: 2.0 (larger batch more stable gradients)
    norm_type: 2

  # Loss weights
  loss_weights:
    # Box regression losses
    rgb_box: 1.0
    sonar_box: 1.0
    fusion_box: 2.0

    # Classification losses (if applicable)
    rgb_cls: 0.5
    sonar_cls: 0.5
    fusion_cls: 1.0

    # Weak 3D losses
    weak3d_reg: 1.0
    weak3d_cycle: 0.5

    # Consistency losses (renamed for clarity)
    # geometric_consistency: compares geometric encodings (fusion layer, scale vs radial)
    # component_consistency: compares X coordinate predictions (weak3d head, X_rgb vs X_sonar)
    geometric_consistency: 0.1
    component_consistency: 0.1
    representation_consistency: 0.1

    # CRITICAL FIX (Audit 2025111414 Finding 3): Quality fusion loss
    # Supervises learned fusion weights against physical quality cues
    quality_fusion_loss: 0.2

    # temporal_smooth removed (Audit 2025112104) - no temporal modeling

  # Loss weight scheduling
  loss_schedule:
    enabled: false  # Default disabled for stability, enable for curriculum learning
    type: linear  # linear, step, cosine
    max_epoch: 60

    # Target weights at end of training (if enabled)
    target_weights:
      fusion_box: 3.0
      weak3d_cycle: 1.0

  # Validation
  val_interval: 1  # Validate every N epochs
  val_num_samples: null  # null means use all val data

  # Checkpointing
  checkpoint:
    save_interval: 5
    save_best: true
    save_last: true
    max_keep: 5
    metric: val_total  # Metric for best model selection (validation loss)
    mode: min  # min for loss, max for accuracy/AUC

  # Logging
  log_interval: 10  # Log every N iterations
  tensorboard: true
  wandb: false

  # Resume training
  resume: null  # Path to checkpoint or null
  load_optimizer: true
  load_scheduler: true


# ------------------------------------------------------------------------------
# Evaluation Configuration
# ------------------------------------------------------------------------------
evaluation:
  # Evaluation mode
  mode: test  # val or test

  # Batch size
  batch_size: 1  # Usually 1 for tracking evaluation

  # Metrics to compute
  metrics:
    - success_auc
    - precision_20
    - avg_center_error
    - mean_iou
    - success_0.5

  # Per-modality evaluation
  evaluate_rgb: true
  evaluate_sonar: true
  evaluate_fusion: true

  # CRITICAL FIX (Audit 2025111703 Finding 4): Template update strategy
  # Enable evaluation of template-update protocols (OSTrack, TrDiMP baselines)
  template_update:
    enabled: false  # Enable template update during tracking
    interval: 10  # Frames between template updates (typical: 10-20)

  # Visualization
  visualization:
    enabled: true
    save_dir: outputs/visualization

    # What to visualize
    plot_trajectories: true
    plot_curves: true
    plot_attention: false  # Attention maps (slow)
    create_videos: false  # Create tracking videos (slow)

    # Failure analysis
    save_failure_cases: true
    num_best: 5
    num_worst: 5

  # Result saving
  save_predictions: true
  save_metrics: true
  save_report: true
  output_dir: outputs/evaluation


# ------------------------------------------------------------------------------
# Ablation Study Configuration
# ------------------------------------------------------------------------------
ablation:
  # Which components to ablate (set to false to disable)
  components:
    # vision_mamba removed (Audit 2025112104) - no temporal modeling
    geometry_gating: true
    quality_gating: true
    weak3d_cycle: true
    deformable_attention: true
    dual_consistency: true

  # temporal_alternative removed (Audit 2025112104) - no temporal modeling


# ------------------------------------------------------------------------------
# Demo/Inference Configuration
# ------------------------------------------------------------------------------
demo:
  # Input source
  input_type: video  # video, images, camera
  input_path: null  # Path to video/image directory
  camera_id: 0  # For camera input

  # Initial bounding box
  init_bbox: null  # [cx, cy, w, h] or null for manual selection

  # Visualization
  display: true
  save_video: false
  output_path: outputs/demo/result.mp4

  # FPS limit
  fps: 30

  # Modality to display
  show_modality: fusion  # rgb, sonar, fusion


# ------------------------------------------------------------------------------
# Paths Configuration
# ------------------------------------------------------------------------------
paths:
  # Working directories
  work_dir: outputs
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs

  # Pretrained models
  pretrained:
    vit_base: null  # Will use timm default

  # Data cache
  cache_dir: .cache


# ------------------------------------------------------------------------------
# Experiment Tracking
# ------------------------------------------------------------------------------
experiment:
  name: aquasot3d_default
  tags: []
  notes: ""

  # Experiment ID (auto-generated if null)
  id: null

  # Group experiments
  group: default


# ------------------------------------------------------------------------------
# Debugging Configuration
# ------------------------------------------------------------------------------
debug:
  enabled: false

  # Fast dev run (train on small subset)
  fast_dev_run: false
  fast_dev_run_steps: 10

  # Profiling
  profiler: false  # simple, advanced, pytorch

  # Detect anomaly
  detect_anomaly: false

  # Overfit test (train on 1 batch)
  overfit_batches: 0  # 0 means disabled, >0 means number of batches
