# AquaSOT-3D Default Configuration

system:
  seed: 42                    # Random seed for reproducibility
  device: cuda                # Training device
  num_gpus: 1                 # Number of GPUs
  distributed: false          # Distributed training flag
  dist_backend: nccl          # Distributed backend
  dist_url: env://            # Distributed URL
  use_amp: false              # Mixed precision training
  amp_dtype: bfloat16         # AMP data type when enabled
  deterministic: false        # Deterministic mode (slower)
  benchmark: true             # cuDNN benchmark mode

data:
  data_root: data             # Dataset root directory
  train_sequences: [uuv1, uuv2, uuv4, uuv5, uuv7, uuv8, uuv9, uuv11, uuv12]
  val_sequences: [uuv3, uuv6, uuv10]
  test_sequences: [uuv3, uuv6, uuv10]
  train_root: null            # Override train data root
  val_root: null              # Override val data root
  test_root: null             # Override test data root
  train_split: train          # Training split name
  val_split: val              # Validation split name
  test_split: test            # Test split name
  visibility_policy: all      # Frame filtering: all/any/both
  num_workers: 12             # DataLoader workers [🚀A4000: 48]
  pin_memory: true            # Pin memory for faster transfer
  prefetch_factor: 4          # Prefetch batches per worker [🚀A4000: 8]
  persistent_workers: true    # Keep workers alive between epochs
  template_size: 128          # Template frame size
  search_size: 256            # Search frame size
  template_search_gap_range: [1, 20]   # Gap range: 1-20 frames = 0.1-2.0s @10Hz (Audit 2025120102)
  search_area_factor: 4.0     # Search region = sqrt(w*h) * factor
  template_area_factor: 2.0   # Template region = sqrt(w*h) * factor
  # CRITICAL FIX (Audit 2025120403 Issue 16): Jitter factor documentation
  # Jitter is DISABLED by default in default.yaml for inference/evaluation safety.
  # Training config (train.yaml) overrides with moderate values (0.15, 0.1).
  # DO NOT use large jitter values (>0.25) which break multi-modal spatial correspondence.
  # For uncalibrated multi-modal tracking, recommended range: 0.1 ~ 0.2
  center_jitter_factor: 0.0   # Default: disabled (override in train.yaml)
  scale_jitter_factor: 0.0    # Default: disabled (override in train.yaml)
  use_attention_mask: true    # Enable attention mask for padded regions

  augmentation:
    enabled: true             # Enable data augmentation
    brightness: 0.2           # Brightness jitter range
    contrast: 0.2             # Contrast jitter range
    saturation: 0.2           # Saturation jitter range
    hue: 0.1                  # Hue jitter range
    rotation: 15.0            # Rotation angle (degrees)
    scale_range: [0.8, 1.2]   # Scale jitter range
    translation_range: [0.1, 0.1]  # Translation range (ratio)
    horizontal_flip: 0.5      # Horizontal flip probability
    vertical_flip: 0.0        # Vertical flip probability
    random_erase: 0.3         # Random erasing probability
    erase_ratio: [0.02, 0.2]  # Erasing area ratio range

  # CRITICAL FIX (Audit 2025121001 Issue 13): Modality dropout for robustness training
  # Randomly drops modalities during training to train single/zero-modality operation
  # This helps the model learn to handle sensor failures and partial observability
  modality_dropout:
    enabled: false            # Master switch for modality dropout
    p_drop_rgb: 0.1           # Probability of dropping RGB modality
    p_drop_sonar: 0.1         # Probability of dropping Sonar modality
    p_drop_both: 0.02         # Probability of dropping both modalities
    mode: zero                # Dropout mode: 'zero' or 'noise'
    # Adaptive dropout settings (curriculum learning)
    adaptive: false           # Enable adaptive dropout with curriculum
    warmup_epochs: 50         # Epochs to ramp up dropout rates

  normalize:
    rgb_mean: [0.485, 0.456, 0.406]  # ImageNet RGB mean
    rgb_std: [0.229, 0.224, 0.225]   # ImageNet RGB std
    sonar_mean: [0.5]         # Sonar normalization mean
    sonar_std: [0.5]          # Sonar normalization std

model:
  type: AquaSOT3DTracker      # Model architecture type

  backbone:
    rgb:
      type: vit_rgb                     # RGB backbone type
      model_name: vit_base_patch16_224  # ViT model variant
      pretrained: true                  # Use ImageNet pretrained weights
      pretrained_path: null             # Custom pretrained path
      freeze_backbone: false            # Freeze backbone parameters
      in_channels: 3                    # Input channels
      embed_dim: 768                    # Embedding dimension
      template_size: 128                # Template size
      search_size: 256                  # Search size

    sonar:
      type: vit_sonar                   # Sonar backbone type
      model_name: vit_base_patch16_224  # ViT model variant
      pretrained: true                  # Use ImageNet pretrained weights
      pretrained_path: null             # Custom pretrained path
      freeze_backbone: false            # Freeze backbone parameters
      in_channels: 1                    # Input channels (grayscale)
      embed_dim: 768                    # Embedding dimension
      template_size: 128                # Template size
      search_size: 256                  # Search size

  fusion:
    type: conditional_dcma    # Conditional DCMA fusion module
    rgb_channels: 768         # RGB feature channels
    sonar_channels: 768       # Sonar feature channels
    embed_dim: 768            # Fusion embedding dimension
    num_heads: 8              # Multi-head attention heads
    num_layers: 2             # Number of fusion layers
    # CRITICAL FIX (Audit 2025121001 Issue 15): Removed use_quality_gating/quality_threshold
    # These fields were not implemented in ConditionalDCMA. Routing now uses:
    # 1. Head validity outputs (rgb_validity/sonar_validity) - preferred
    # 2. Backbone confidence (routing_rgb_confidence/routing_sonar_confidence) - fallback
    confidence_threshold: 0.3  # Routing confidence threshold (used when validity not available)
    use_deformable: true      # Enable deformable attention
    num_points: 4             # Deformable attention points
    num_levels: 1             # Feature pyramid levels
    component_consistency_weight: 0.1       # Component consistency loss weight
    representation_consistency_weight: 0.1  # Representation consistency loss weight
    # CRITICAL FIX (Audit 2025121001 Issue 8): IdentityFusion for single-modality ablation
    # To run single-modality experiments without cross-modal fusion, use:
    #   type: identity_fusion
    #   embed_dim: 768
    #   active_modality: rgb  # or 'sonar' for sonar-only experiments

  heads:
    rgb_box:
      type: CenterHead        # OSTrack-style CENTER prediction head
      in_channels: 768        # Input feature channels
      hidden_dim: 256         # Hidden layer dimension
      use_offset: true        # Enable sub-pixel offset refinement
      loss_weight_score: 1.0  # Score map loss weight
      loss_weight_size: 5.0   # Size regression loss weight

    sonar_box:
      type: CenterHead        # OSTrack-style CENTER prediction head
      in_channels: 768        # Input feature channels
      hidden_dim: 256         # Hidden layer dimension
      use_offset: true        # Enable sub-pixel offset refinement
      loss_weight_score: 1.0  # Score map loss weight
      loss_weight_size: 5.0   # Size regression loss weight

training:
  init_backbones:
    rgb: null                 # RGB backbone initialization path
    sonar: null               # Sonar backbone initialization path

  num_epochs: 60              # Total training epochs [🚀A4000: 60]
  batch_size: 2               # Batch size per GPU [🚀A4000: 8]
  val_batch_size: 8           # Validation batch size [🚀A4000: 16]
  gradient_accumulation_steps: 4  # Gradient accumulation steps [🚀A4000: 1]

  optimizer:
    type: adamw               # Optimizer type
    lr: 0.0001                # Base learning rate [🚀A4000: 0.0001]
    weight_decay: 0.0001      # Weight decay coefficient
    betas: [0.9, 0.999]       # Adam beta coefficients
    eps: 1.0e-8               # Adam epsilon
    use_layer_decay: true     # Enable layer-wise LR decay
    layer_decay_rate: 0.75    # Layer decay rate
    backbone_lr_multiplier: 0.1  # Backbone LR multiplier

  scheduler:
    type: cosine              # LR scheduler type
    warmup_epochs: 5          # Warmup epochs [🚀A4000: 5]
    warmup_lr: 0.00001        # Warmup starting LR [🚀A4000: 0.00001]
    min_lr: 0.000001          # Minimum learning rate
    t_max: 60                 # Cosine annealing period
    eta_min: 0.000001         # Cosine annealing minimum LR

  grad_clip:
    enabled: true             # Enable gradient clipping
    max_norm: 0.1             # Max gradient norm (OSTrack standard, DO NOT change to 1.0)
    norm_type: 2              # Gradient norm type

  loss_weights:
    rgb_box: 1.0              # RGB box regression loss weight
    rgb_conf: 1.0             # RGB confidence loss weight
    # CRITICAL FIX (Audit 2025121001 Issue 14): Add validity loss weights for fusion routing
    rgb_validity: 1.0         # RGB validity loss weight (head-validity for fusion routing)
    sonar_box: 1.0            # Sonar box regression loss weight
    sonar_conf: 1.0           # Sonar confidence loss weight
    sonar_validity: 1.0       # Sonar validity loss weight (head-validity for fusion routing)
    aux_rgb: 0.3              # Auxiliary RGB loss weight
    aux_sonar: 0.3            # Auxiliary Sonar loss weight
    geometric_consistency: 0.5      # Geometric consistency loss weight
    representation_consistency: 0.3 # Representation consistency loss weight
    view_consistency: 0.1     # View consistency loss weight
    # CRITICAL FIX (Audit 2025121001 Issue 4): Routing validity loss for ConditionalDCMA
    routing_validity: 0.5     # Routing validity loss (BCE on confidence estimators)

  loss_schedule:
    enabled: false            # Enable loss weight scheduling
    type: linear              # Schedule type
    max_epoch: 60             # Schedule duration

  val_interval: 1             # Validation interval (epochs)
  val_num_samples: null       # Validation samples (null=all)

  checkpoint:
    save_interval: 5          # Checkpoint save interval (epochs)
    save_best: true           # Save best model
    save_last: true           # Save last model
    max_keep: 5               # Maximum checkpoints to keep
    metric: val_total         # Metric for best model selection
    mode: min                 # Metric optimization direction

  # Optional online evaluation during training (Audit 11/12)
  online_eval:
    enabled: false            # Enable lightweight online evaluation hook
    sequences: null           # Defaults to data.val_sequences when null
    data_root: null           # Defaults to data.data_root when null
    template_size: null       # Defaults to data.template_size when null
    search_size: null         # Defaults to data.search_size when null
    template_area_factor: null  # Defaults to data.template_area_factor when null
    search_area_factor: null    # Defaults to data.search_area_factor when null
    template_update_interval: 10
    template_update_threshold: 0.7
    template_min_size: 5.0
    template_edge_margin: 2
    template_scan_frames: 20
    enable_template_quality_filter: true
  log_interval: 10            # Logging interval (iterations)
  tensorboard: true           # Enable TensorBoard logging
  # CRITICAL FIX (Audit 2025120403 Issue 22): WandB not implemented
  # wandb integration is not currently implemented in trainer.py.
  # Setting this to true will have no effect. Use tensorboard instead.
  wandb: false                # NOT IMPLEMENTED - use tensorboard
  resume: null                # Resume checkpoint path
  load_optimizer: true        # Load optimizer state on resume
  load_scheduler: true        # Load scheduler state on resume

evaluation:
  mode: test                  # Evaluation mode: val/test
  batch_size: 1               # Evaluation batch size
  metrics: [success_auc, precision_20, avg_center_error, mean_iou, success_0.5]
  evaluate_rgb: true          # Evaluate RGB predictions
  evaluate_sonar: true        # Evaluate Sonar predictions

  # CRITICAL FIX (Audit 2025121001 Issue 12): Configurable validity gating
  # Validity gating filters predictions based on learned validity scores
  # Default: disabled to evaluate all predictions without filtering
  validity_gating:
    enabled: false            # Master switch for validity gating
    rgb_threshold: 0.35       # RGB validity threshold (when enabled)
    sonar_threshold: 0.40     # Sonar validity threshold (when enabled)
    confidence_fallback: 0.30 # Fallback threshold for confidence/quality

  template_update:
    enabled: false            # Enable template update during tracking
    interval: 10              # Template update interval (frames)

  visualization:
    enabled: true             # Enable visualization
    save_dir: outputs/visualization  # Visualization output directory
    plot_trajectories: true   # Plot tracking trajectories
    plot_curves: true         # Plot performance curves
    plot_attention: false     # Plot attention maps
    create_videos: false      # Create tracking videos
    save_failure_cases: true  # Save failure cases
    num_best: 5               # Number of best cases to save
    num_worst: 5              # Number of worst cases to save

  save_predictions: true      # Save prediction results
  save_metrics: true          # Save computed metrics
  save_report: true           # Save evaluation report
  output_dir: outputs/evaluation  # Evaluation output directory

ablation:
  components:
    quality_gating: true      # Enable quality gating
    deformable_attention: true    # Enable deformable attention
    dual_consistency: true    # Enable dual consistency

demo:
  input_type: video           # Input source type: video/images/camera
  input_path: null            # Input file path
  camera_id: 0                # Camera device ID
  init_bbox: null             # Initial bounding box [cx, cy, w, h]
  display: true               # Display tracking results
  save_video: false           # Save output video
  output_path: outputs/demo/result.mp4  # Output video path
  fps: 30                     # Output video FPS
  show_modality: rgb          # Modality to display: rgb/sonar

paths:
  work_dir: outputs           # Working directory
  checkpoint_dir: outputs/checkpoints  # Checkpoint directory
  log_dir: outputs/logs       # Log directory
  pretrained:
    vit_base: null            # ViT-Base pretrained path
  cache_dir: .cache           # Cache directory

experiment:
  name: aquasot3d_default     # Experiment name
  tags: []                    # Experiment tags
  notes: ""                   # Experiment notes
  id: null                    # Experiment ID
  group: default              # Experiment group

debug:
  enabled: false              # Enable debug mode
  fast_dev_run: false         # Fast development run
  fast_dev_run_steps: 10      # Steps for fast dev run
  profiler: false             # Enable profiling
  detect_anomaly: false       # Detect NaN/Inf anomalies
  overfit_batches: 0          # Overfit on N batches (0=disabled)
