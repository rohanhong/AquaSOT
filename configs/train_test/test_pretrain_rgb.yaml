# ==============================================================================
# RGB-Only Pretraining Test Configuration (Small Scale)
#
# Quick test configuration for Stage 1 validation with minimal resources.
# Used for debugging and integration testing before full training.
#
# Author: AquaSOT-3D Team
# Date: 2025-11-11
# ==============================================================================

_base_: ../base/default.yaml


# ------------------------------------------------------------------------------
# Experiment Configuration
# ------------------------------------------------------------------------------
experiment:
  name: aquasot3d_test_rgb
  tags: [test, rgb_only, pretrain, debug]
  notes: "Small-scale RGB pretraining test for validation"
  group: testing


# ------------------------------------------------------------------------------
# Data Configuration
# ------------------------------------------------------------------------------
data:
  train_root: data/uuv2
  val_root: data/uuv3

  # Use minimal workers for testing
  num_workers: 2
  prefetch_factor: 1


# ------------------------------------------------------------------------------
# Model Configuration
# ------------------------------------------------------------------------------
model:
  # Disable sonar branch and fusion
  backbone:
    sonar:
      type: null  # Disable sonar encoder

  fusion:
    type: null  # Disable fusion

  temporal:
    enabled: true
    num_layers: 2  # Reduced for testing

  heads:
    # Only RGB head enabled
    rgb_box:
      type: BoxHead
      in_channels: 768
      hidden_dim: 256

    sonar_box:
      type: null

    fusion_box:
      type: null

    weak3d:
      type: null


# ------------------------------------------------------------------------------
# Training Configuration
# ------------------------------------------------------------------------------
training:
  num_epochs: 5  # Minimal epochs for testing

  batch_size: 4  # Small batch for quick iteration
  gradient_accumulation_steps: 1

  optimizer:
    lr: 0.0003
    weight_decay: 0.0001

  scheduler:
    type: cosine
    warmup_epochs: 1
    t_max: 5

  # Loss weights - RGB only
  loss_weights:
    rgb_box: 1.0
    rgb_cls: 0.5
    temporal_smooth: 0.05
    # All other losses disabled
    sonar_box: 0.0
    sonar_cls: 0.0
    fusion_box: 0.0
    fusion_cls: 0.0
    weak3d_reg: 0.0
    weak3d_cycle: 0.0
    component_consistency: 0.0
    representation_consistency: 0.0

  val_interval: 2  # Validate every 2 epochs

  checkpoint:
    save_interval: 2
    metric: rgb_success_auc
    mode: max

  log_interval: 5  # Log every 5 iterations


# ------------------------------------------------------------------------------
# Debugging Configuration
# ------------------------------------------------------------------------------
debug:
  enabled: true
  fast_dev_run: false  # Set to true for single-batch overfitting test
  fast_dev_run_steps: 10


# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
paths:
  work_dir: outputs/test_stage1_rgb
  checkpoint_dir: outputs/test_stage1_rgb/checkpoints
  log_dir: outputs/test_stage1_rgb/logs
