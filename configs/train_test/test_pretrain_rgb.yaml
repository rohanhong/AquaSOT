# ==============================================================================
# RGB-Only Pretraining Test Configuration (Small Scale)
#
# Quick test configuration for Stage 1 validation with minimal resources.
# Used for debugging and integration testing before full training.
#
# Author: AquaSOT-3D Team
# Date: 2025-11-11
# ==============================================================================

_base_: ../base/default.yaml


# ------------------------------------------------------------------------------
# Experiment Configuration
# ------------------------------------------------------------------------------
experiment:
  name: aquasot3d_test_rgb
  tags: [test, rgb_only, pretrain, debug]
  notes: "Small-scale RGB pretraining test for validation"
  group: testing


# ------------------------------------------------------------------------------
# Data Configuration
# ------------------------------------------------------------------------------
data:
  train_root: data/uuv2
  val_root: data/uuv3

  # Use minimal workers for testing
  num_workers: 2
  prefetch_factor: 1

  # Augmentation for RGB-only (domain-specific transforms)
  augmentation:
    enabled: true

    # RGB-specific transforms (optical imagery)
    rgb:
      enable_color_jitter: true
      brightness: 0.3
      contrast: 0.3
      saturation: 0.3
      hue: 0.2
      color_jitter_prob: 0.5

      enable_blur: true
      blur_prob: 0.3

      enable_occlusion: true
      occlusion_prob: 0.2
      occlusion_min_size: 0.05
      occlusion_max_size: 0.3

    # Sonar disabled for RGB-only pretraining
    sonar:
      enable_speckle: false
      enable_radial_jitter: false
      enable_sector_occlusion: false


# ------------------------------------------------------------------------------
# Model Configuration
# ------------------------------------------------------------------------------
model:
  # Disable sonar branch and fusion
  backbone:
    sonar:
      type: null  # Disable sonar encoder

  fusion:
    type: null  # Disable fusion

  temporal:
    enabled: true
    num_layers: 2  # Reduced for testing

  heads:
    # Only RGB head enabled
    rgb_box:
      type: BoxHead
      in_channels: 768
      hidden_dim: 256

    sonar_box:
      type: null

    fusion_box:
      type: null

    weak3d:
      type: null


# ------------------------------------------------------------------------------
# Training Configuration
# ------------------------------------------------------------------------------
training:
  num_epochs: 5  # Minimal epochs for testing

  batch_size: 8
  gradient_accumulation_steps: 1

  optimizer:
    lr: 0.0003
    weight_decay: 0.0001

  scheduler:
    type: cosine
    warmup_epochs: 1
    t_max: 5

  # Loss weights - RGB only
  loss_weights:
    rgb_box: 1.0
    rgb_cls: 0.5
    temporal_smooth: 0.05
    # All other losses disabled
    sonar_box: 0.0
    sonar_cls: 0.0
    fusion_box: 0.0
    fusion_cls: 0.0
    weak3d_reg: 0.0
    weak3d_cycle: 0.0
    geometric_consistency: 0.0
    component_consistency: 0.0
    representation_consistency: 0.0

  val_interval: 1  # Validate every epoch for best checkpoint tracking

  checkpoint:
    save_interval: 5  # Save interval checkpoint every 5 epochs
    metric: val_total  # Use validation total loss for best tracking
    mode: min  # Lower loss is better

  log_interval: 5  # Log every 5 iterations


# ------------------------------------------------------------------------------
# Debugging Configuration
# ------------------------------------------------------------------------------
debug:
  enabled: true
  fast_dev_run: false  # Set to true for single-batch overfitting test
  fast_dev_run_steps: 10


# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
paths:
  work_dir: outputs/test_stage1_rgb
  checkpoint_dir: outputs/test_stage1_rgb/checkpoints
  log_dir: outputs/test_stage1_rgb/logs
