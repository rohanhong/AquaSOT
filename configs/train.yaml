# AquaSOT-3D Training Configuration

_base_: default.yaml

experiment:
  name: aquasot3d_full_training   # Experiment name
  tags: [end-to-end, dual-modality, fusion]
  notes: "Single-stage full training with dual-modality fusion"
  group: full_training            # Experiment group

system:
  use_amp: false                  # Mixed precision (disabled for stability)

data:
  data_root: data                 # Dataset root directory
  train_sequences: [uuv1, uuv2, uuv4, uuv5, uuv7, uuv8, uuv9, uuv11, uuv12]
  val_sequences: [uuv3, uuv6, uuv10]
  train_root: null                # Override train data root
  val_root: null                  # Override val data root
  visibility_policy: all          # Frame filtering: all/any/both
  template_size: 128              # Template frame size
  search_size: 256                # Search frame size
  template_search_gap_range: [1, 20]   # Gap range: 1-20 frames = 0.1-2.0s @10Hz (Audit 2025120102)
  search_area_factor: 4.0         # Search region = sqrt(w*h) * factor
  template_area_factor: 2.0       # Template region = sqrt(w*h) * factor
  # CRITICAL FIX (Audit 2025120403 Issue 16): Standardized jitter factors
  # Jitter enables model to learn off-center prediction but must be carefully tuned:
  # - Too small (< 0.1): model predicts center bias, poor drift recovery
  # - Too large (> 0.25): breaks cross-modal spatial alignment in uncalibrated multi-modal
  #
  # Current values (0.15, 0.1) balance:
  # 1. Training diversity for drift recovery
  # 2. Multi-modal spatial consistency preservation
  # 3. Combined with confidence-driven search expansion (OnlineTrackingEvaluator)
  #
  # Reference values:
  # - OSTrack: 3.0 (single modal, not applicable here)
  # - Recommended for uncalibrated multi-modal: 0.1 ~ 0.2
  center_jitter_factor: 0.15      # Center jitter: sqrt(w*h) * 0.15 offset range
  scale_jitter_factor: 0.1        # Scale jitter: exp(randn * 0.1) multiplier
  use_attention_mask: true        # Enable attention mask for padded regions
  template_update_policy: mixformer    # Template update for training: mixformer/first/recent
  # CRITICAL FIX (Audit 2025120401 Finding 3): Validation template policy
  # Must use 'first_frame' to align with online tracking protocol (OnlineTrackingEvaluator)
  val_template_update_policy: first_frame  # Validation uses first frame like online eval
  quality_threshold_rgb: 0.7      # RGB quality threshold for template update
  quality_threshold_sonar: 0.7    # Sonar quality threshold for template update
  # CRITICAL FIX (Audit 2025120402 Finding 5): Template quality filtering for validation
  # Ensures val selects best quality template (not edge-clipped, sufficient size)
  # Consistent with OnlineTrackingEvaluator behavior
  val_enable_template_quality_filter: true  # Enable quality-based template selection for val
  template_min_size: 5.0          # Minimum bbox dimension (pixels)
  template_edge_margin: 2         # Minimum distance from image edge (pixels)
  template_scan_frames: 20        # Number of frames to scan for best template
  num_workers: 12                 # DataLoader workers [🚀A4000: 48]
  prefetch_factor: 4              # Prefetch batches per worker [🚀A4000: 8]

  augmentation:
    enabled: true                 # Enable data augmentation
    type: TrackingAugmentation    # Augmentation pipeline type
    rgb:
      enable_color_jitter: true   # Enable RGB color jitter
      brightness: 0.3             # Brightness jitter range
      contrast: 0.3               # Contrast jitter range
      saturation: 0.3             # Saturation jitter range
      hue: 0.2                    # Hue jitter range
      color_jitter_prob: 0.5      # Color jitter probability
      enable_blur: true           # Enable Gaussian blur
      blur_prob: 0.3              # Blur probability
      enable_occlusion: true      # Enable random occlusion
      occlusion_prob: 0.2         # Occlusion probability
      occlusion_min_size: 0.05    # Min occlusion size (ratio)
      occlusion_max_size: 0.3     # Max occlusion size (ratio)
    sonar:
      enable_speckle: true        # Enable speckle noise
      speckle_level: 0.1          # Speckle noise level
      speckle_prob: 0.5           # Speckle probability
      enable_occlusion: true      # Enable random occlusion
      occlusion_prob: 0.2         # Occlusion probability
      occlusion_min_size: 0.05    # Min occlusion size (ratio)
      occlusion_max_size: 0.3     # Max occlusion size (ratio)

model:
  backbone:
    rgb:
      type: vit_rgb                     # RGB backbone type
      model_name: vit_base_patch16_224  # ViT model variant
      pretrained: true                  # Use ImageNet pretrained weights
      pretrained_path: null             # Custom pretrained path
      freeze_backbone: false            # Freeze backbone parameters
      in_channels: 3                    # Input channels
      embed_dim: 768                    # Embedding dimension
      template_size: 128                # Template size
      search_size: 256                  # Search size
    sonar:
      type: vit_sonar                   # Sonar backbone type
      model_name: vit_base_patch16_224  # ViT model variant
      pretrained: true                  # Use ImageNet pretrained weights
      pretrained_path: null             # Custom pretrained path
      freeze_backbone: false            # Freeze backbone parameters
      in_channels: 1                    # Input channels (grayscale)
      embed_dim: 768                    # Embedding dimension
      template_size: 128                # Template size
      search_size: 256                  # Search size

  fusion:
    type: conditional_g2_dcma     # Conditional G2-DCMA fusion module
    rgb_channels: 768             # RGB feature channels
    sonar_channels: 768           # Sonar feature channels
    embed_dim: 768                # Fusion embedding dimension
    num_heads: 8                  # Multi-head attention heads
    num_layers: 2                 # Number of fusion layers

  heads:
    rgb_box:
      type: CenterHead            # OSTrack-style CENTER prediction head
      in_channels: 768            # Input feature channels
      hidden_dim: 256             # Hidden layer dimension
      use_offset: true            # Enable sub-pixel offset refinement
      loss_weight_score: 1.0      # Score map loss weight
      loss_weight_size: 5.0       # Size regression loss weight
    sonar_box:
      type: CenterHead            # OSTrack-style CENTER prediction head
      in_channels: 768            # Input feature channels
      hidden_dim: 256             # Hidden layer dimension
      use_offset: true            # Enable sub-pixel offset refinement
      loss_weight_score: 1.0      # Score map loss weight
      loss_weight_size: 5.0       # Size regression loss weight

training:
  num_epochs: 100                 # Total training epochs [🚀A4000: 100]
  batch_size: 2                   # Batch size per GPU [🚀A4000: 8]
  gradient_accumulation_steps: 4  # Gradient accumulation [🚀A4000: 1]

  optimizer:
    lr: 0.0001                    # Base learning rate [🚀A4000: 0.0001]
    weight_decay: 0.0001          # Weight decay coefficient
    backbone_lr_multiplier: 0.1   # Backbone LR multiplier

  scheduler:
    type: cosine                  # LR scheduler type
    warmup_epochs: 5              # Warmup epochs [🚀A4000: 5]
    warmup_lr: 1.0e-05            # Warmup starting LR [🚀A4000: 1.0e-05]
    t_max: 100                    # Cosine annealing period
    eta_min: 1.0e-06              # Cosine annealing minimum LR

  grad_clip:
    enabled: true                 # Enable gradient clipping
    max_norm: 0.1                 # Max gradient norm (OSTrack standard, DO NOT change to 1.0)
    norm_type: 2                  # Gradient norm type

  loss_weights:
    rgb_box: 1.0                  # RGB box regression loss weight
    rgb_conf: 1.0                 # RGB confidence loss weight
    sonar_box: 1.0                # Sonar box regression loss weight
    sonar_conf: 1.0               # Sonar confidence loss weight
    aux_rgb: 0.3                  # Auxiliary RGB loss weight
    aux_sonar: 0.3                # Auxiliary Sonar loss weight
    geometric_consistency: 0.5    # Geometric consistency loss weight
    representation_consistency: 0.3   # Representation consistency loss weight
    view_consistency: 0.1         # View consistency loss weight

  loss_schedule:
    enabled: false                # Enable loss weight scheduling

  val_interval: 1                 # Validation interval (epochs)

  checkpoint:
    save_interval: 5              # Checkpoint save interval (epochs)
    save_best: true               # Save best model
    save_last: true               # Save last model
    metric: val_total             # Metric for best model selection
    mode: min                     # Metric optimization direction
    max_keep: 5                   # Maximum checkpoints to keep

  # Optional online evaluation during training (Audit 11/12)
  online_eval:
    enabled: false                # Set true to run lightweight online eval on val sequences
    sequences: null               # Defaults to data.val_sequences when null
    data_root: null               # Defaults to data.data_root when null
    template_update_interval: 10
    template_update_threshold: 0.7
    template_min_size: 5.0
    template_edge_margin: 2
    template_scan_frames: 20
    enable_template_quality_filter: true

  log_interval: 10                # Logging interval (iterations)
  resume: null                    # Resume checkpoint path

debug:
  enabled: false                  # Enable debug mode
  fast_dev_run: false             # Fast development run

paths:
  work_dir: outputs/train                     # Working directory
  checkpoint_dir: outputs/train/checkpoints   # Checkpoint directory
  log_dir: outputs/train/logs                 # Log directory
