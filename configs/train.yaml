# ==============================================================================
# AquaSOT-3D Full Training Configuration
# ==============================================================================
# Single-stage end-to-end training with RGB + Sonar dual-modality
# No pretraining - trains from scratch using ImageNet-pretrained ViT backbones

_base_: default.yaml


# ------------------------------------------------------------------------------
# Experiment Configuration
# ------------------------------------------------------------------------------
experiment:
  name: aquasot3d_full_training
  tags: [end-to-end, dual-modality, fusion]
  notes: "Single-stage full training from scratch with dual-modality fusion"
  group: full_training


# ------------------------------------------------------------------------------
# Data Configuration (Multi-Sequence)
# ------------------------------------------------------------------------------
data:
  data_root: data
  train_sequences: [uuv1, uuv2, uuv4, uuv5, uuv7, uuv8, uuv9, uuv11, uuv12]
  val_sequences: [uuv3, uuv6, uuv10]

  train_root: null
  val_root: null

  # Frame-level temporal tracking parameters (inherited from default.yaml)
  # sequence_length: 5  # Number of consecutive frames per training sample
  # frame_stride: 1     # Stride for frame sampling
  use_sequence_grouping: true

  num_workers: 8  # Higher performance: 16 (Xeon W9-3475X 36C/72T)
  prefetch_factor: 2  # Higher performance: 3

  augmentation:
    enabled: true
    type: TrackingAugmentation

    rgb:
      enable_color_jitter: true
      brightness: 0.3
      contrast: 0.3
      saturation: 0.3
      hue: 0.2
      color_jitter_prob: 0.5

      enable_blur: true
      blur_prob: 0.3

      enable_occlusion: true
      occlusion_prob: 0.2
      occlusion_min_size: 0.05
      occlusion_max_size: 0.3

    sonar:
      enable_speckle: true
      speckle_level: 0.1
      speckle_prob: 0.5

      # Rectangular occlusion (similar to RGB, suitable for rect coordinates)
      enable_occlusion: true
      occlusion_prob: 0.2
      occlusion_min_size: 0.05
      occlusion_max_size: 0.3


# ------------------------------------------------------------------------------
# Model Configuration
# ------------------------------------------------------------------------------
model:
  backbone:
    rgb:
      type: vit_rgb
      model_name: vit_small_patch16_224
      pretrained: true
      output_dim: 384

    sonar:
      type: vit_sonar
      model_name: vit_small_patch16_224
      pretrained: true
      in_channels: 1  # Single-channel sonar (1ch -> 3ch adapter applied internally)
      # NOTE: Sonar images are preprocessed to fixed 682x376, then resized to 224x224 for model input
      img_size: 224
      output_dim: 384

  fusion:
    type: g2_dcma
    embed_dim: 384
    num_heads: 8
    num_layers: 2

  temporal:
    type: mamba
    enabled: true
    num_layers: 2
    d_state: 16
    d_conv: 4
    expand: 2
    bidirectional: false
    use_occlusion_gating: true
    dropout: 0.1
    max_spatial_size: 32
    aggregation: true
    aggregator:
      momentum: 0.9
      gate_threshold: 0.5

  heads:
    rgb_box:
      type: BoxHead
      in_channels: 384
      hidden_dim: 256

    sonar_box:
      type: BoxHead
      in_channels: 384
      hidden_dim: 256

    fusion_box:
      type: FusionHead
      rgb_channels: 384
      sonar_channels: 384
      hidden_dim: 256

    weak3d:
      type: Weak3DHead
      in_channels: 384
      hidden_dim: 256
      output_dim: 3
      use_cyclic_loss: true


# ------------------------------------------------------------------------------
# Training Configuration
# ------------------------------------------------------------------------------
training:
  # Single-stage training: no pretraining required
  # Backbones initialized from ImageNet-pretrained weights (timm)

  num_epochs: 100  # Extended for end-to-end convergence

  batch_size: 1  # Optimized for 8GB GPU (RTX 3070 Ti)
  gradient_accumulation_steps: 4  # Effective batch = 1×4 = 4

  optimizer:
    lr: 0.0001  # Standard learning rate for ViT fine-tuning
    weight_decay: 0.0001
    backbone_lr_multiplier: 0.1  # Lower LR for pretrained backbones

  scheduler:
    type: cosine
    warmup_epochs: 10  # Extended warmup for training from scratch
    warmup_lr: 1.0e-06
    t_max: 100  # Matches num_epochs
    eta_min: 1.0e-06

  # Gradient clipping
  grad_clip:
    enabled: true
    max_norm: 1.0  # Higher performance: 2.0 (pretrained backbones more stable)
    norm_type: 2

  loss_weights:
    rgb_box: 1.0
    rgb_cls: 0.5
    sonar_box: 1.0
    sonar_cls: 0.5
    fusion_box: 2.0
    fusion_cls: 1.0
    weak3d_reg: 1.0
    weak3d_cycle: 0.5
    geometric_consistency: 0.1
    component_consistency: 0.1
    representation_consistency: 0.1
    quality_fusion_loss: 0.2
    temporal_smooth: 0.05

  loss_schedule:
    enabled: false

  val_interval: 1

  checkpoint:
    save_interval: 5
    save_best: true
    save_last: true
    metric: val_total
    mode: min
    max_keep: 5

  log_interval: 10

  resume: null


# ------------------------------------------------------------------------------
# Debugging
# ------------------------------------------------------------------------------
debug:
  enabled: false
  fast_dev_run: false


# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
paths:
  work_dir: outputs/train_multiseq
  checkpoint_dir: outputs/train_multiseq/checkpoints
  log_dir: outputs/train_multiseq/logs
