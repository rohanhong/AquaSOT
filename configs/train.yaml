# ==============================================================================
# AquaSOT-3D Full Training Configuration
# ==============================================================================
# Single-stage end-to-end training with RGB + Sonar dual-modality
# No pretraining - trains from scratch using ImageNet-pretrained ViT backbones

_base_: default.yaml


# ------------------------------------------------------------------------------
# Experiment Configuration
# ------------------------------------------------------------------------------
experiment:
  name: aquasot3d_full_training
  tags: [end-to-end, dual-modality, fusion]
  notes: "Single-stage full training from scratch with dual-modality fusion"
  group: full_training


# ------------------------------------------------------------------------------
# Data Configuration (Multi-Sequence)
# ------------------------------------------------------------------------------
data:
  data_root: data
  train_sequences: [uuv1, uuv2, uuv4, uuv5, uuv7, uuv8, uuv9, uuv11, uuv12]
  val_sequences: [uuv3, uuv6, uuv10]

  train_root: null
  val_root: null

  # ARCHITECTURE CHANGE (Audit 2025112104): Template-search paradigm (OSTrack-style)
  # Removed: sequence_length, frame_stride, use_sequence_grouping
  template_size: 256  # Template image size (256x256)
  search_size: 512    # Search image size (512x512, full-frame search)
  template_search_gap_range: [1, 200]  # Random gap between template and search frames (OSTrack standard)

  # Template Update Policy (MixFormer Implementation)
  # - Training: Uses random gap sampling (behaves like 'recent') to learn from diverse temporal distances
  # - Inference: Quality-driven updates in OnlineTracker (independent RGB/Sonar refresh based on quality)
  template_update_policy: 'mixformer'
  quality_threshold_rgb: 0.7     # RGB quality threshold for template update (inference only)
  quality_threshold_sonar: 0.7   # Sonar quality threshold for template update (inference only)

  num_workers: 8  # Laptop: 8 (Workstation: 16)
  prefetch_factor: 3  # Laptop: 3 (Workstation: 4)

  augmentation:
    enabled: true
    type: TrackingAugmentation

    rgb:
      enable_color_jitter: true
      brightness: 0.3
      contrast: 0.3
      saturation: 0.3
      hue: 0.2
      color_jitter_prob: 0.5

      enable_blur: true
      blur_prob: 0.3

      enable_occlusion: true
      occlusion_prob: 0.2
      occlusion_min_size: 0.05
      occlusion_max_size: 0.3

    sonar:
      enable_speckle: true
      speckle_level: 0.1
      speckle_prob: 0.5

      # Rectangular occlusion (similar to RGB, suitable for rect coordinates)
      enable_occlusion: true
      occlusion_prob: 0.2
      occlusion_min_size: 0.05
      occlusion_max_size: 0.3


# ------------------------------------------------------------------------------
# Model Configuration
# ------------------------------------------------------------------------------
model:
  backbone:
    rgb:
      type: vit_rgb
      model_name: vit_base_patch16_224
      pretrained: true
      output_dim: 768

    sonar:
      type: vit_sonar
      model_name: vit_base_patch16_224
      pretrained: true
      in_channels: 1  # Single-channel sonar (1ch -> 3ch adapter applied internally)
      # NOTE: Sonar images are preprocessed to fixed 682x376, then resized to 512x512 for model input
      img_size: 512
      output_dim: 768

  fusion:
    type: g2_dcma
    embed_dim: 768
    num_heads: 8
    num_layers: 2

  # ARCHITECTURE CHANGE (Audit 2025112104): Temporal modules completely removed
  # Template-search paradigm uses implicit temporal modeling via per-frame template updates

  heads:
    rgb_box:
      type: BoxHead
      in_channels: 768
      hidden_dim: 256
      use_confidence_head: true  # CONTINUOUS FLOW: Enable objectness prediction
      loss_weight_conf: 1.0

    sonar_box:
      type: BoxHead
      in_channels: 768
      hidden_dim: 256
      use_confidence_head: true  # CONTINUOUS FLOW: Enable objectness prediction
      loss_weight_conf: 1.0

    # ARCHITECTURE UPDATE (Audit 2025112313 - Dual-View Fusion):
    # fusion_box REMOVED. RGB and Sonar BoxHeads now use dual-view fused features.
    # - rgb_box uses rgb_view_fused (RGB perspective with complementary Sonar)
    # - sonar_box uses sonar_view_fused (Sonar perspective with complementary RGB)
    # This enables end-to-end learning of RGB-Sonar correspondence without calibration.


# ------------------------------------------------------------------------------
# Training Configuration
# ------------------------------------------------------------------------------
training:
  # Single-stage training: no pretraining required
  # Backbones initialized from ImageNet-pretrained weights (timm)

  num_epochs: 100  # Extended for end-to-end convergence

  batch_size: 2  # Laptop: 2 (Workstation: 8), effective batch with grad_accum = 32
  gradient_accumulation_steps: 16  # Laptop: 16 (Workstation: 4, effective batch = 32)

  optimizer:
    lr: 0.0001  # Standard learning rate for ViT fine-tuning
    weight_decay: 0.0001
    backbone_lr_multiplier: 0.1  # Lower LR for pretrained backbones

  scheduler:
    type: cosine
    warmup_epochs: 10  # Extended warmup for training from scratch
    warmup_lr: 1.0e-06
    t_max: 100  # Matches num_epochs
    eta_min: 1.0e-06

  # Gradient clipping
  grad_clip:
    enabled: true
    max_norm: 1.0  # Same for both Laptop and Workstation (effective_batch=32 is identical)
    norm_type: 2

  # CRITICAL FIX (Audit 2025112302): Removed Weak3D component
  # Architecture simplified to focus on 2D tracking with cross-modal fusion
  # CONTINUOUS FLOW DESIGN (Audit 2025112310): Added confidence loss weights
  # ARCHITECTURE UPDATE (Audit 2025112313 - Dual-View Fusion): Removed fusion losses
  loss_weights:
    # Box regression (dual-view fused features)
    rgb_box: 1.0
    rgb_cls: 0.5
    rgb_conf: 1.0  # Objectness confidence (has_object prediction)
    sonar_box: 1.0
    sonar_cls: 0.5
    sonar_conf: 1.0  # Objectness confidence (has_object prediction)

    # Auxiliary losses (feature degradation prevention, training only)
    aux_rgb_loss: 0.3  # Lightweight auxiliary head on pre-fusion RGB features
    aux_sonar_loss: 0.3  # Lightweight auxiliary head on pre-fusion Sonar features

    # Cross-modal consistency losses
    geometric_consistency: 0.5         # Fusion layer: scale vs radial encoding alignment
    representation_consistency: 0.3    # InfoNCE contrastive loss for feature alignment
    view_consistency: 0.1              # Dual-view consistency (rgb_view_fused vs sonar_view_fused)

  loss_schedule:
    enabled: false

  val_interval: 1

  checkpoint:
    save_interval: 5
    save_best: true
    save_last: true
    metric: val_total
    mode: min
    max_keep: 5

  log_interval: 10

  resume: null


# ------------------------------------------------------------------------------
# Debugging
# ------------------------------------------------------------------------------
debug:
  enabled: false
  fast_dev_run: false


# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
paths:
  work_dir: outputs/train_multiseq
  checkpoint_dir: outputs/train_multiseq/checkpoints
  log_dir: outputs/train_multiseq/logs
