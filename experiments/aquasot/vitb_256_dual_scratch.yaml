# Test config without pretrained weights (for testing training pipeline)
MODEL:
  PRETRAIN_FILE: ""  # No pretrained weights

  BACKBONE:
    RGB:
      TYPE: vit_base_patch16_224
      DROP_PATH_RATE: 0.1
    SONAR:
      TYPE: vit_base_patch16_224
      DROP_PATH_RATE: 0.1

  FUSION:
    TYPE: dcma
    NUM_LAYERS: 2
    NUM_HEADS: 8
    # Inference fusion weights (training uses 1.0 by default for full cross-modal learning)
    RGB_FUSION_WEIGHT: 0.3
    SONAR_FUSION_WEIGHT: 0.3

  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256

TRAIN:
  LR: 0.0001
  EPOCH: 2
  BATCH_SIZE: 2
  NUM_WORKER: 4
  GRADIENT_ACCUMULATION: 1

DATA:
  ROOT: data
  TRAIN:
    SEQUENCES: [uuv1]
    SAMPLE_PER_EPOCH: 10
  VAL:
    SEQUENCES: [uuv3]
    SAMPLE_PER_EPOCH: 5

  SEARCH:
    CENTER_JITTER: 1.0
    SCALE_JITTER: 0.25

  TEMPLATE:
    ONLINE_NUMBER: 1  # Online template sampling during training

  AUGMENTATION:
    ENABLED: true
    HORIZONTAL_FLIP: true
    HORIZONTAL_FLIP_PROB: 0.5
    RGB:
      BRIGHTNESS: 0.2
      COLOR_JITTER: true
      CONTRAST: 0.3
      SATURATION: 0.3
      HUE: 0.2
      GRAYSCALE: true
      GRAYSCALE_PROB: 0.05
      BLUR: true
      BLUR_PROB: 0.3
      OCCLUSION: true
      OCCLUSION_PROB: 0.2
    SONAR:
      SPECKLE: true
      SPECKLE_LEVEL: 0.1
      SPECKLE_PROB: 0.5
      OCCLUSION: true
      OCCLUSION_PROB: 0.2

SYSTEM:
  SEED: 42
