# Ablation: RGB-only tracking (via modality dropout)
#
# Uses modality dropout to zero out sonar modality
# This simulates single-modal operation while preserving dual architecture
#
# Target loss handler will detect Sonar as perpetually LOST (score=0),
# causing primary output to use RGB predictions exclusively.

MODEL:
  FUSION:
    TYPE: dcma

TRAIN:
  EPOCH: 100

DATA:
  MODALITY_DROPOUT:
    ENABLED: true
    P_DROP_RGB: 0.0
    P_DROP_SONAR: 1.0

TEST:
  TARGET_LOSS:
    ENABLED: true  # Detects dropped Sonar as LOST, uses RGB exclusively

EXPERIMENT:
  NAME: ablation_rgb_only
  GROUP: ablation
  TAGS: [rgb_only, ablation]
