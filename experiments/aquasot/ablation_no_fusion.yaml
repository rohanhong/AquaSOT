  FUSION:
    TYPE: identity

TRAIN:
  EPOCH: 100

TEST:
  TARGET_LOSS:
    ENABLED: true  # Both modalities active, handler operates normally

EXPERIMENT:
  NAME: ablation_no_fusion
  GROUP: ablation
  TAGS: [no_fusion, ablation]
